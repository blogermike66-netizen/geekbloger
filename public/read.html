<script>
const API = window.location.origin;
let currentArticle = null;

function formatDate(date){
  if(!date) return "";
  const d=new Date(date);
  return d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
}

async function loadArticles(){
  try{
    const res=await fetch(`${API}/articles`);
    const data=await res.json();
    return Array.isArray(data)?data:[];
  }catch(e){return [];}
}

function goBack(){
  if(document.referrer && document.referrer.includes(window.location.host)){
    history.back();
  }else{
    window.location.href = "index.html";
  }
}

/* =========================
   RENDER THE ARTICLE
========================= */
function renderArticle(article){
  currentArticle = article;

  document.getElementById("pageTitle").innerText = article.title + " - GeekHub";
  const desc = (article.content || "").replace(/<[^>]*>/g,"").slice(0,150);
  document.getElementById("pageDescription").setAttribute("content", desc);

  document.getElementById("articleContent").innerHTML=`
    <h1>${article.title}</h1>
    <p style="color:gray">By ${article.author||"GeekHub"} • ${formatDate(article.date)}</p>
    <img src="${article.image||''}" style="width:100%">
    <div>${article.content}</div>
  `;

  document.getElementById("likeCount").innerText = article.likes || 0;

  loadComments();

  loadArticles().then(data=>{
    const side=document.getElementById("articleSide");
    side.innerHTML="<h3>More in this category</h3>";

    data
      .filter(a => a.category === article.category && a._id !== article._id)
      .slice(0,5)
      .forEach(a=>{
        const div=document.createElement("div");
        div.className="side-item";
        div.innerHTML=`<img src="${a.image||''}"><span>${a.title}</span>`;
        div.onclick=()=>{ window.location.href = "read.html?id=" + a._id; };
        side.appendChild(div);
      });
  });

  document.getElementById("articleLayout").style.display="flex";
  document.getElementById("notFound").style.display="none";

  showLikeNudge();
}

/* =========================
   COMMENTS
========================= */
function loadComments(){
  const box=document.getElementById("comments");
  box.innerHTML="";
  (currentArticle.comments||[]).forEach(c=>{
    const d=document.createElement("div");
    d.className="comment";
    d.innerText=c;
    box.appendChild(d);
  });
}

async function addComment(){
  const t = document.getElementById("commentText").value;
  if(!t) return;
  if(!currentArticle._id) return;

  await fetch(`${API}/articles/${currentArticle._id}/comment`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({comment:t})
  });

  if(!currentArticle.comments) currentArticle.comments = [];
  currentArticle.comments.push(t);

  document.getElementById("commentText").value = "";
  loadComments();
}

/* =========================
   LIKE / FAVOURITE
========================= */
async function likeArticle(){
  if(!currentArticle || !currentArticle._id) return;

  await fetch(`${API}/articles/${currentArticle._id}/like`, {method:"POST"});

  currentArticle.likes = (currentArticle.likes || 0) + 1;
  document.getElementById("likeCount").innerText = currentArticle.likes;
}

function favArticle(){
  alert("Saved to favourites (you can connect backend later)");
}

function openEdit(){
  const key = prompt("Enter password to edit:");
  if(key !== "Gambatukatiyamika03"){
    if(key !== null) alert("Wrong password ❌");
    return;
  }

  localStorage.setItem("editArticle",JSON.stringify(currentArticle));
  window.location.href="/write.html";
}

/* =========================
   LIKE NUDGE
========================= */
let nudgeReady = false;
let nudge = null;
let showTimer = null;
let autoHideTimer = null;

function showLikeNudge(){
  nudge = document.getElementById("likeNudge");
  if(!nudge) return;

  clearTimeout(showTimer);
  clearTimeout(autoHideTimer);

  nudge.classList.remove("show");
  nudgeReady = false;

  showTimer = setTimeout(() => {
    nudge.classList.add("show");
    nudgeReady = true;

    autoHideTimer = setTimeout(() => {
      nudge.classList.remove("show");
      nudgeReady = false;
    }, 180000);
  }, 4000);
}

document.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("likeNudge");
  if(!el) return;

  el.onclick = () => {
    if(!nudgeReady) return;

    likeArticle();

    el.innerHTML = "🔥 Thanks for the support!";
    el.style.background = "#28a745";

    nudgeReady = false;
    clearTimeout(autoHideTimer);

    setTimeout(() => {
      el.classList.remove("show");
    }, 1200);
  };
});

/* =========================
   STARTUP — load the article from ?id=
========================= */
(function startup(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if(!id){
    document.getElementById("notFound").style.display="block";
    return;
  }

  fetch(`${API}/articles/${id}`)
    .then(r => r.json())
    .then(article => {
      if(article && article._id){
        renderArticle(article);
      }else{
        document.getElementById("notFound").style.display="block";
      }
    })
    .catch(() => {
      document.getElementById("notFound").style.display="block";
    });
})();
</script>
