<script>
const API = window.location.origin;

/* =========================
   GNEWS-POWERED TECH FEED
========================= */
const GNEWS_API_KEY = "0b41d82ebdb09181c35a521e452f4855";
const GNEWS_CACHE_MINUTES = 1440; // refresh once per 24 hours

function gnewsURL(category){
  return `https://gnews.io/api/v4/top-headlines?category=${category}&lang=en&apikey=${GNEWS_API_KEY}`;
}

async function loadGNewsCategory(category){
  const cacheKey = `geekhub_gnews_v2_${category}`;

  try{
    const cachedRaw = localStorage.getItem(cacheKey);
    if(cachedRaw){
      const cached = JSON.parse(cachedRaw);
      const ageMinutes = (Date.now() - cached.timestamp) / 60000;
      if(ageMinutes < GNEWS_CACHE_MINUTES && Array.isArray(cached.articles) && cached.articles.length > 0){
        return cached.articles;
      }
    }
  }catch(e){ /* ignore bad cache */ }

  try{
    const res = await fetch(gnewsURL(category));
    const data = await res.json();
    const articles = Array.isArray(data.articles) ? data.articles : [];

    if(res.ok && articles.length > 0){
      try{
        localStorage.setItem(cacheKey, JSON.stringify({
          timestamp: Date.now(),
          articles
        }));
      }catch(e){ /* storage full/unavailable, skip caching */ }
    }else{
      console.error(`GNews returned no usable articles (${category})`, data);
    }

    return articles;
  }catch(e){
    console.error(`GNews fetch failed (${category})`, e);
    return [];
  }
}

function newsCardHTML(a, badge){
  const img = a.image ? `<img src="${a.image}" onerror="this.style.display='none'">` : "";
  const source = a.source && a.source.name ? a.source.name : "News";
  return `
    <div class="tech-card" onclick="window.open('${a.url}','_blank')">
      <span class="tech-badge">${badge}</span>
      ${img}
      <h4>${a.title}</h4>
      <small>${source} • ${formatDate(a.publishedAt)}</small>
    </div>
  `;
}

function newsGridHTML(a, badge){
  return `
    <div class="article-card" onclick="window.open('${a.url}','_blank')" style="position:relative">
      <span class="tech-badge">${badge}</span>
      ${a.image ? `<img src="${a.image}" onerror="this.style.display='none'">` : ""}
      <h3>${a.title}</h3>
      <p>${a.description || ""}</p>
      <small style="padding:0 10px;display:block;color:gray;padding-bottom:10px;">${(a.source && a.source.name) || "News"} • ${formatDate(a.publishedAt)}</small>
    </div>
  `;
}

async function renderTechStrip(){
  const strip = document.getElementById("techStrip");
  if(!strip) return;

  const news = await loadGNewsCategory("technology");

  if(!news.length){
    strip.innerHTML = "";
    return;
  }

  strip.innerHTML = `
    <h3>🌐 Live Tech Headlines</h3>
    <div class="tech-scroll">
      ${news.slice(0,8).map(a => newsCardHTML(a, "🌐 LIVE")).join("")}
    </div>
  `;
}

async function showFeed(category, badge, emptyMessage){
  document.getElementById("homeLayout").style.display = "none";
  document.getElementById("techStrip").innerHTML = "";
  document.getElementById("articles").style.display = "grid";

  const news = await loadGNewsCategory(category);
  const container = document.getElementById("articles");

  if(!news.length){
    container.innerHTML = `<div class="tech-card empty">${emptyMessage}</div>`;
    return;
  }

  container.innerHTML = news.map(a => newsGridHTML(a, badge)).join("");
}

function showTechNews(){
  return showFeed("technology", "🌐 LIVE", "Couldn't load tech news right now — try again shortly.");
}

/* =========================
   ARTICLE NAVIGATION
   Articles open on their own page (read.html).
========================= */
function openArticle(id){
  window.location.href = "read.html?id=" + id;
}

function formatDate(date){
  if(!date) return "";
  const d=new Date(date);
  return d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
}

function showCategory(category){
  loadArticles().then(dbArticles => {
    const filtered = dbArticles.filter(article =>
      article.category &&
      article.category.toLowerCase() === category.toLowerCase()
    );

    document.getElementById("homeLayout").style.display = "none";
    document.getElementById("techStrip").innerHTML = "";
    document.getElementById("articles").style.display = "grid";

    renderArticles(filtered);
  });
}

/* =========================
   LOAD ARTICLES
========================= */
async function loadArticles(){
  try{
    const res=await fetch(`${API}/articles`);
    const data=await res.json();
    return Array.isArray(data)?data:[];
  }catch(e){return [];}
}

/* =========================
   BIG SCREEN HERO + TRENDING STRIP
   The hero always shows whichever is genuinely the most recent —
   your own latest article, or the newest live tech headline —
   comparing actual publish timestamps from both sources. It never
   sits empty as long as either source has something.
========================= */
function buildHome(dbArticles, techNews){
  const heroEl = document.getElementById("heroBig");
  const stripEl = document.getElementById("trendingStrip");

  const sortedDb = [...dbArticles].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const sortedNews = [...techNews].sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));

  const topDb = sortedDb[0] || null;
  const topNews = sortedNews[0] || null;

  let heroItem = null;
  let heroType = null; // "own" or "api"

  if(topDb && topNews){
    if(new Date(topDb.date) >= new Date(topNews.publishedAt)){
      heroItem = topDb; heroType = "own";
    }else{
      heroItem = topNews; heroType = "api";
    }
  }else if(topDb){
    heroItem = topDb; heroType = "own";
  }else if(topNews){
    heroItem = topNews; heroType = "api";
  }

  if(!heroItem){
    heroEl.className = "hero-big hero-empty";
    heroEl.innerHTML = `<div class="hero-overlay"><h1 style="font-size:20px;">New content coming soon</h1></div>`;
    heroEl.onclick = null;
    stripEl.innerHTML = "";
    return;
  }

  heroEl.className = "hero-big";

  if(heroType === "own"){
    heroEl.innerHTML = `
      <img src="${heroItem.image||''}">
      <div class="hero-overlay">
        <span class="hero-tag">${heroItem.category ? heroItem.category : "Featured"}</span>
        <h1>${heroItem.title}</h1>
        <div class="hero-meta">By ${heroItem.author||"GeekHub"} • ${formatDate(heroItem.date)}</div>
      </div>
    `;
    heroEl.onclick = () => openArticle(heroItem._id);
  }else{
    const source = heroItem.source && heroItem.source.name ? heroItem.source.name : "News";
    heroEl.innerHTML = `
      <img src="${heroItem.image||''}">
      <div class="hero-overlay">
        <span class="hero-tag">🌐 Live Tech</span>
        <h1>${heroItem.title}</h1>
        <div class="hero-meta">${source} • ${formatDate(heroItem.publishedAt)}</div>
      </div>
    `;
    heroEl.onclick = () => window.open(heroItem.url, "_blank");
  }

  // Trending strip: your own latest articles, minus whichever one is the hero right now
  const trendingSource = sortedDb.filter(a => !(heroType === "own" && a._id === heroItem._id));

  stripEl.innerHTML = trendingSource.length
    ? `<span class="trending-label">🔥 Trending</span>` +
      trendingSource.slice(0,6).map(a =>
        `<a onclick="openArticle('${a._id}')">${a.title}</a>`
      ).join("")
    : "";
}

/* =========================
   RENDER ARTICLES
========================= */
function renderArticles(list){
  const container=document.getElementById("articles");
  container.innerHTML="";

  const sorted=[...list].sort((a,b)=>new Date(b.date)-new Date(a.date));

  sorted.forEach(a=>{
    const card=document.createElement("div");
    card.className="article-card";

    card.innerHTML=`
      <img src="${a.image||''}">
      <h3>${a.title}</h3>
      <p>👍 ${a.likes||0} | 💬 ${(a.comments||[]).length} | 👁 ${a.views||0}</p>
    `;

    const meta=document.createElement("small");
    meta.style.padding="0 10px";
    meta.style.display="block";
    meta.style.color="gray";
    meta.innerText=`By ${a.author||"GeekHub"} • ${formatDate(a.date)}`;
    card.appendChild(meta);

    card.onclick=()=>openArticle(a._id);
    container.appendChild(card);
  });
}

/* =========================
   NAVIGATION
========================= */
function goHome(){
  document.getElementById("homeLayout").style.display="block";
  document.getElementById("articles").style.display="grid";
  showHome();
}

/* =========================
   LOAD DATA
========================= */
async function showHome(){
  const [dbArticles, techNews] = await Promise.all([
    loadArticles(),
    loadGNewsCategory("technology")
  ]);

  renderArticles(dbArticles);
  buildHome(dbArticles, techNews);
  renderTechStrip();
}

/* =========================
   STARTUP
   Supports deep links from read.html's nav: index.html?cat=X
   or index.html?feed=technology
========================= */
(function startup(){
  const params = new URLSearchParams(window.location.search);
  const cat = params.get("cat");
  const feed = params.get("feed");

  if(feed === "technology"){
    showTechNews();
  }else if(cat){
    showCategory(cat);
  }else{
    showHome();
  }
})();
</script>
