<a onclick="showCategory('news')">News</a>

<div class="main-layout" id="homeLayout">

<script>
let currentArticle=null;
let ADMIN_KEY="Gambatukatiyamike03";
const API = window.location.origin;

/* =========================
   FORMAT DATE
========================= */
function formatDate(date){
  if(!date) return "";
  const d=new Date(date);
  return d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
}

function showCategory(category){

  loadArticles().then(dbArticles => {

    const allArticles = dbArticles;

    const filtered = allArticles.filter(article =>
      article.category &&
      article.category.toLowerCase() === category.toLowerCase()
    );

    document.getElementById("homeLayout").style.display = "none";
    document.getElementById("articlePage").style.display = "none";
    document.getElementById("articles").style.display = "grid";

    renderArticles(filtered);
  });

}

/* =========================
   URL HANDLING
========================= */
function setURL(article, replace=false){
  const url = article && article._id ? `/article/${article._id}` : `/`;

  if(replace){
    history.replaceState({}, "", url);
  }else{
    history.pushState({}, "", url);
  }
}

/* =========================
   LOAD ARTICLES
========================= */
async function loadArticles(){
  try{
    const res=await fetch(`${API}/articles`);
    const data=await res.json();
    return Array.isArray(data)?data:[];
  }catch(e){return [];}
}

/* =========================
   HOME HERO + SIDEBAR
========================= */
function buildHome(data){
  if(!data.length) return;

  const sorted=[...data].sort((a,b)=>new Date(b.date)-new Date(a.date));

  document.getElementById("hero").innerHTML=`
    <img src="${sorted[0].image||''}">
    <h2>${sorted[0].title}</h2>
  `;

  document.getElementById("hero").onclick=()=>openArticle(sorted[0]);

  const side=document.getElementById("sidebar");
  side.innerHTML="<h3>Trending</h3>";

  sorted.slice(0,5).forEach(a=>{
    const div=document.createElement("div");
    div.innerHTML="🔥 "+a.title;
    div.onclick=()=>openArticle(a);
    side.appendChild(div);
  });
}

/* =========================
   RENDER ARTICLES
========================= */
function renderArticles(list){
  const container=document.getElementById("articles");
  container.innerHTML="";

  const sorted=[...list].sort((a,b)=>new Date(b.date)-new Date(a.date));
  buildHome(sorted);

  sorted.forEach(a=>{
    const card=document.createElement("div");
    card.className="article-card";

    card.innerHTML=`
      <img src="${a.image||''}">
      <h3>${a.title}</h3>
      <p>👍 ${a.likes||0} | 💬 ${(a.comments||[]).length}</p>
    `;

    const meta=document.createElement("small");
    meta.style.padding="0 10px";
    meta.style.display="block";
    meta.style.color="gray";
    meta.innerText=`By ${a.author||"GeekHub"} • ${formatDate(a.date)}`;
    card.appendChild(meta);

    card.onclick=()=>openArticle(a);
    container.appendChild(card);
  });
}

/* =========================
   OPEN ARTICLE
========================= */
function openArticle(article){
  currentArticle=article;
  setURL(article);

  document.getElementById("homeLayout").style.display="none";
  document.getElementById("articles").style.display="none";
  document.getElementById("articlePage").style.display="block";

  document.getElementById("articleContent").innerHTML=`
    <h1>${article.title}</h1>
    <p style="color:gray">By ${article.author||"GeekHub"} • ${formatDate(article.date)}</p>
    <img src="${article.image||''}" style="width:100%">
    <div>${article.content}</div>
  `;

  document.getElementById("likeCount").innerText=article.likes||0;

  loadComments();

  loadArticles().then(data=>{
    const side=document.getElementById("articleSide");
    side.innerHTML="<h3>More in this category</h3>";

    data
    .filter(a =>
  a.category === article.category &&
  (a._id ? a._id !== article._id : true)
)
      .slice(0,5)
      .forEach(a=>{
        const div=document.createElement("div");
        div.className="side-item";
        div.innerHTML=`<img src="${a.image||''}"><span>${a.title}</span>`;
        div.onclick=()=>openArticle(a);
        side.appendChild(div);
      });
  });

  // ✅ TRIGGER ANIMATION
  showLikeNudge();
}

/* =========================
   NAVIGATION
========================= */
function goHome(){
  setURL(null);
  document.getElementById("articlePage").style.display="none";
  document.getElementById("homeLayout").style.display="flex";
  document.getElementById("articles").style.display="grid";
  showHome();
}

window.onpopstate = () => {
  const path = window.location.pathname;

  if(path.startsWith("/article/")){
    const id = path.split("/article/")[1];

    fetch(`${API}/articles/${id}`)
      .then(r=>r.json())
      .then(article=>{
        if(article && article._id){
          openArticle(article);
        }
      });
  } else {
    goHome();
  }
};

/* =========================
   LOAD DATA
========================= */
async function showHome(){

  const dbArticles = await loadArticles();

  renderArticles(dbArticles);
}


/* =========================
   COMMENTS
========================= */
function loadComments(){
  const box=document.getElementById("comments");
  box.innerHTML="";
  (currentArticle.comments||[]).forEach(c=>{
    const d=document.createElement("div");
    d.className="comment";
    d.innerText=c;
    box.appendChild(d);
  });
}

/* =========================
   LIKE SYSTEM
========================= */
async function likeArticle(){

  if(!currentArticle) return;

  if(!currentArticle._id){
    alert("Likes only work on GeekHub articles.");
    return;
  }

  await fetch(
    `${API}/articles/${currentArticle._id}/like`,
    {method:"POST"}
  );

  currentArticle.likes =
    (currentArticle.likes || 0) + 1;

  document.getElementById("likeCount").innerText =
    currentArticle.likes;
}

/* =========================
   COMMENTS POST
========================= */
async function addComment(){

  const t =
    document.getElementById("commentText").value;

  if(!t) return;

  if(!currentArticle._id){
    alert("Comments only work on GeekHub articles.");
    return;
  }

  await fetch(
    `${API}/articles/${currentArticle._id}/comment`,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        comment:t
      })
    }
  );

  if(!currentArticle.comments)
    currentArticle.comments = [];

  currentArticle.comments.push(t);

  document.getElementById("commentText").value = "";

  loadComments();
}

/* =========================
   OTHER ACTIONS
========================= */
function favArticle(){
  alert("Saved to favourites (you can connect backend later)");
}

function openEdit(){
  const key=prompt("Enter admin key:");
  if(key===ADMIN_KEY){
    localStorage.setItem("editArticle",JSON.stringify(currentArticle));
    window.location.href="/write.html";
  }
}

/* =========================
   DIRECT LINK CHECK
========================= */
checkDirectLink();

function checkDirectLink(){
  const path=window.location.pathname;

  if(path.startsWith("/article/")){
    const id=path.split("/article/")[1];

    fetch(`${API}/articles/${id}`)
      .then(r=>r.json())
      .then(article=>{
        if(article && article._id){
          openArticle(article);
        }else showHome();
      });
  }else showHome();
}

let nudgeReady = false;
let nudge = null;

let showTimer = null;
let autoHideTimer = null;

function showLikeNudge(){
  nudge = document.getElementById("likeNudge");
  if(!nudge) return;

  // CLEAR OLD TIMERS (important fix)
  clearTimeout(showTimer);
  clearTimeout(autoHideTimer);

  // reset state
  nudge.classList.remove("show");
  nudgeReady = false;

  // show after 4 seconds
  showTimer = setTimeout(() => {
    nudge.classList.add("show");
    nudgeReady = true;

    // AUTO HIDE AFTER 3 MINUTES
    autoHideTimer = setTimeout(() => {
      nudge.classList.remove("show");
      nudgeReady = false;
    }, 180000);

  }, 4000);
}

/* CLICK HANDLER */
document.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("likeNudge");
  if(!el) return;

  el.onclick = () => {
    if(!nudgeReady) return;

    likeArticle();

    el.innerHTML = "🔥 Thanks for the support!";
    el.style.background = "#28a745";

    nudgeReady = false;

    clearTimeout(autoHideTimer);

    setTimeout(() => {
      el.classList.remove("show");
    }, 1200);
  };
});
</script>
